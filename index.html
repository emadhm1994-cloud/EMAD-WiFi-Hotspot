<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>EMAD-WiFi | Hotspot Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
}

/* Animated Background */
.bg{
  position:absolute;
  width:200%;
  height:200%;
  background:
    radial-gradient(circle at 20% 20%,#00c6ff,transparent 40%),
    radial-gradient(circle at 80% 30%,#ff00cc,transparent 40%),
    radial-gradient(circle at 50% 80%,#00ff99,transparent 40%);
  animation:move 20s linear infinite;
}
@keyframes move{
  0%{transform:translate(0,0)}
  50%{transform:translate(-25%,-25%)}
  100%{transform:translate(0,0)}
}

/* Glass Card */
.card{
  position:relative;
  z-index:2;
  width:360px;
  padding:30px;
  border-radius:22px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  box-shadow:0 0 60px rgba(0,0,0,.8);
  animation:fadeIn .8s ease;
}
@keyframes fadeIn{
  from{opacity:0;transform:scale(.85)}
  to{opacity:1;transform:scale(1)}
}

/* Logo Neon */
.logo{
  text-align:center;
  font-size:36px;
  font-weight:800;
  letter-spacing:3px;
  margin-bottom:6px;
  position:relative;
}
.logo .emad{
  background:linear-gradient(90deg,#00c6ff,#00ff99);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:
    0 0 10px rgba(0,198,255,.8),
    0 0 20px rgba(0,255,153,.6);
}
.logo .wifi{
  margin-left:6px;
  font-size:28px;
  color:#fff;
  text-shadow:
    0 0 10px #ff00cc,
    0 0 25px rgba(255,0,204,.8);
}
.logo::after{
  content:'';
  position:absolute;
  left:50%;
  bottom:-6px;
  transform:translateX(-50%);
  width:80%;
  height:3px;
  background:linear-gradient(90deg,#00c6ff,#ff00cc);
  border-radius:50px;
  box-shadow:0 0 20px rgba(255,0,204,.8);
  animation:pulse 2s infinite alternate;
}
@keyframes pulse{
  from{opacity:.4; width:50%}
  to{opacity:1; width:90%}
}

/* Wi-Fi Signal Animation above logo */
.wifi-signal{
  position:absolute;
  top:-25px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
.wifi-signal span{
  position:absolute;
  top:50%;
  left:50%;
  width:8px;
  height:8px;
  border:2px solid #00c6ff;
  border-radius:50%;
  opacity:0;
  transform-origin:-12px 0;
  animation:orbit 2s linear infinite;
}
.wifi-signal span:nth-child(2){animation-delay:1s;}
@keyframes orbit{
  0%{transform:rotate(0deg) translateX(12px) rotate(0deg);}
  100%{transform:rotate(360deg) translateX(12px) rotate(-360deg);}
}

/* Subtitle */
.sub{
  text-align:center;
  font-size:13px;
  opacity:.85;
  margin-bottom:15px;
}

/* Clock */
.clock{
  text-align:center;
  font-size:20px;
  margin-bottom:20px;
  text-shadow:0 0 10px #00c6ff;
}

/* Inputs */
input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:none;
  border-radius:14px;
  background:rgba(0,0,0,.4);
  color:#fff;
  font-size:14px;
}
input::placeholder{color:#ccc}

/* Button */
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:16px;
  background:linear-gradient(90deg,#00c6ff,#ff00cc);
  font-size:16px;
  color:#fff;
  cursor:pointer;
  box-shadow:0 0 15px rgba(0,198,255,.7);
  transition:.3s;
}
button:hover{
  transform:scale(1.05);
  box-shadow:0 0 30px rgba(255,0,204,.8);
}

/* Wi-Fi Speed Waves */
.wifi-speed{
  margin-top:18px;
  text-align:center;
}
.wifi-speed label{
  font-size:13px;
  display:block;
  margin-bottom:6px;
}
.wifi-wave-container{
  position:relative;
  width:50px;
  height:50px;
  margin:0 auto;
}
.wifi-wave-container .wave{
  position:absolute;
  top:50%;
  left:50%;
  width:12px;
  height:12px;
  border:2px solid #00c6ff;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(0);
  opacity:0.8;
  animation:wave-expand 1.5s infinite;
}
.wifi-wave-container .wave:nth-child(2){animation-delay:0.3s;}
.wifi-wave-container .wave:nth-child(3){animation-delay:0.6s;}
.wifi-wave-container .center-dot{
  position:absolute;
  top:50%;
  left:50%;
  width:8px;
  height:8px;
  background:#00ff99;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 10px #00ff99, 0 0 20px #00c6ff;
}
@keyframes wave-expand{
  0%{transform:translate(-50%,-50%) scale(0); opacity:0.8;}
  50%{transform:translate(-50%,-50%) scale(1.5); opacity:0.5;}
  100%{transform:translate(-50%,-50%) scale(2.5); opacity:0;}
}

/* Footer */
.footer{
  text-align:center;
  font-size:11px;
  opacity:.7;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="card">
  <div class="logo">
    <span class="emad">EMAD</span>
    <span class="wifi">WiFi</span>
    <div class="wifi-signal">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
  <div class="sub">مرحبًا بك في الشبكة الذكية 🌐</div>

  <div class="clock" id="clock">--:--:--</div>

  <!-- CoovaChilli Login -->
  <form method="post" action="http://192.168.182.1:3990/logon">
    <input type="text" name="username" placeholder="اسم المستخدم" required>
    <input type="password" name="password" placeholder="كلمة المرور" required>

    <input type="hidden" name="challenge">
    <input type="hidden" name="uamip">
    <input type="hidden" name="uamport">

    <button type="submit">الاتصال بالإنترنت</button>
  </form>

  <!-- Wi-Fi Speed Waves -->
  <div class="wifi-speed">
    <label>سرعة الاتصال</label>
    <div class="wifi-wave-container">
      <span class="wave"></span>
      <span class="wave"></span>
      <span class="wave"></span>
      <span class="center-dot"></span>
    </div>
  </div>

  <div class="footer">© EMAD-WiFi • Secure Network</div>
</div>

<script>
function clock(){
  const d=new Date();
  const t=d.toLocaleTimeString();
  document.getElementById("clock").innerText=t;
}
setInterval(clock,1000);clock();
</script>

</body>
</html>
